# Builds the SysWatch installer and portable zip and publishes them as release v<version> when a v* tag is
# pushed. Nothing runs on ordinary pushes.
#
#   * The tag must match <Version> in SysWatch.csproj and point at a commit on main, and that commit must hold
#     the release notes docs/releases/<version>.md (Turkish list, then "## English" and the English list).
#   * A version is released once: if release v<version> already exists the run stops before building.
#   * The installer is installed and uninstalled silently on the runner before anything is published, so a
#     broken installer never reaches the release page.
#   * Files keep fixed names (SysWatch_x64-setup.exe, SysWatch_x64-portable.zip), so the README's
#     releases/latest/download links always point at the newest version.
#
# To release: raise <Version>, add the notes, push to main, then `git tag v<version>` and `git push origin v<version>`.
# A failed run can be repeated from its page in the Actions tab (Re-run jobs).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content SysWatch.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected <Version> '$version' in SysWatch.csproj." }
          if ('${{ github.ref_name }}' -ne "v$version") { throw "Tag ${{ github.ref_name }} does not match <Version> $version in SysWatch.csproj." }
          if (-not (Test-Path "docs/releases/$version.md")) { throw "docs/releases/$version.md is missing." }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "${{ github.ref_name }} points at a commit that is not on main." }
          gh release view "v$version" --repo "${{ github.repository }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "v$version is already released. Raise <Version> in SysWatch.csproj first." }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "SysWatch $version"
          $global:LASTEXITCODE = 0

      # The installer downloads the .NET 8 Desktop Runtime from this evergreen link when a PC lacks it.
      - name: The runtime download link still works
        shell: pwsh
        run: |
          $r = Invoke-WebRequest -Method Head -Uri 'https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe' -MaximumRedirection 10
          Write-Host "$($r.StatusCode) $($r.BaseResponse.RequestMessage.RequestUri)"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 did not install.' }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version '${{ steps.version.outputs.version }}' -Iscc $env:ISCC

      - name: Install, check and uninstall silently
        shell: pwsh
        run: |
          $dir = "$env:ProgramFiles\SysWatch"
          $p = Start-Process dist/SysWatch_x64-setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=startup', "/LOG=$env:RUNNER_TEMP\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log"; throw "Setup exited with $($p.ExitCode)." }
          foreach ($f in 'SysWatch.exe', 'LICENSE.txt', 'THIRD-PARTY-NOTICES.txt', 'licenses\mpl-2.0.txt', 'unins000.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "$f was not installed." }
          }
          schtasks /Query /TN SysWatch | Out-Null
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log"; throw 'The "start with Windows" task was not created.' }
          $v = (Get-Item "$dir\SysWatch.exe").VersionInfo.ProductVersion
          if (-not $v.StartsWith('${{ steps.version.outputs.version }}')) { throw "Installed exe reports version $v." }
          $config = "$env:APPDATA\SysWatch\config.json"
          if (-not ((Get-Content $config -Raw | ConvertFrom-Json).AutoUpdate -eq $false)) { throw 'Unticking "automatic updates" did not turn them off.' }

          # A silent update, as SysWatch starts it, reopens the app and leaves the user's settings alone.
          $cfg = Get-Content $config -Raw | ConvertFrom-Json
          $cfg.AutoUpdate = $true
          $cfg | ConvertTo-Json -Depth 10 | Set-Content $config -Encoding utf8
          $p = Start-Process dist/SysWatch_x64-setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/UPDATE=1', "/LOG=$env:RUNNER_TEMP\update.log" -PassThru
          # Not -Wait: it would also wait for the SysWatch the update reopens.
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\update.log"; throw "The silent update exited with $($p.ExitCode)." }
          for ($i = 0; $i -lt 20 -and -not (Get-Process SysWatch -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Milliseconds 500 }
          if (-not (Get-Process SysWatch -ErrorAction SilentlyContinue)) { Get-Content "$env:RUNNER_TEMP\update.log"; throw 'SysWatch did not reopen after the silent update.' }
          if (-not ((Get-Content $config -Raw | ConvertFrom-Json).AutoUpdate -eq $true)) { throw 'The silent update changed the automatic-update setting.' }

          $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall exited with $($p.ExitCode)." }
          # The uninstaller removes itself a moment after it exits.
          for ($i = 0; $i -lt 20 -and (Test-Path "$dir\SysWatch.exe"); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path "$dir\SysWatch.exe") { throw 'SysWatch.exe is still there after uninstalling.' }
          schtasks /Query /TN SysWatch 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'The startup task survived the uninstall.' }
          Write-Host "Installed $v, then removed it cleanly."
          $global:LASTEXITCODE = 0

      - name: Checksums
        shell: pwsh
        working-directory: dist
        run: |
          Get-ChildItem -File SysWatch_x64-* | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/SysWatch_x64-setup.exe
            dist/SysWatch_x64-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Release page
        run: python3 scripts/release-notes.py "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        run: |
          gh release create "v$VERSION" release/* \
            --title "SysWatch $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

      - name: Summary
        run: |
          {
            echo "### Released SysWatch $VERSION ($(git rev-parse --short HEAD))"
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
